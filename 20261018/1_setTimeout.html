<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 id="title">我的網頁</h1>
    <div id="container">
        <p class="text">第一段文字</p>
        <p class="text">第二段文字</p>
        <button id="btn">點擊我</button>
    </div>


    <script>
        const AAA = document.getElementById("btn");
        console.log(AAA);

        AAA.addEventListener("click", function() {
            setTimeout(function() {
                const BBB = document.getElementById("btn");
                BBB.textContent = "騙你的我沒有網頁";
            }, 500);
        });
    </script>

    
</body>
</html>
